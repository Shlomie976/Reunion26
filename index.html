<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<title>Who Said It? — Family Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,900&family=Space+Mono:wght@400;700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Nunito Sans', Arial, sans-serif;
    background: #16333A;
    background-image:
      radial-gradient(circle at 15% 10%, rgba(237,163,59,0.10) 0%, transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(226,88,62,0.10) 0%, transparent 45%);
    min-height: 100vh;
    color: #FBF3E4;
  }
  .disp { font-family: 'Fraunces', Georgia, serif; }
  .mono { font-family: 'Space Mono', monospace; }
  @keyframes floatIn { from { opacity: 0; transform: translateY(10px);} to { opacity: 1; transform: translateY(0);} }
  @keyframes pop { 0% { transform: scale(0.85); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  .anim-in { animation: floatIn 0.35s ease both; }
  .anim-pop { animation: pop 0.3s cubic-bezier(.2,1.4,.4,1) both; }
  .ticket { position: relative; background: #FBF3E4; color: #16333A; border-radius: 16px; }
  .ticket::before, .ticket::after {
    content: ""; position: absolute; width: 22px; height: 22px; background: #16333A;
    border-radius: 50%; top: 50%; transform: translateY(-50%);
  }
  .ticket::before { left: -11px; }
  .ticket::after { right: -11px; }
  button { font-family: inherit; }
  input, textarea { font-family: inherit; }
  button:focus-visible, input:focus-visible, textarea:focus-visible {
    outline: 3px solid #EDA33B; outline-offset: 2px;
  }
  .btn-primary {
    background: #E2583E; color: #FBF3E4; border: none; border-radius: 14px;
    padding: 14px 22px; font-size: 17px; font-weight: 800; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    box-shadow: 0 4px 0 #a83c28; width: 100%;
  }
  .btn-primary:disabled { background: #5c6d68; box-shadow: none; cursor: not-allowed; }
  .btn-ghost {
    background: transparent; color: #FBF3E4; border: 2px solid rgba(251,243,228,0.35);
    border-radius: 14px; padding: 12px 20px; font-size: 15px; font-weight: 700; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
  }
  .card { background: #1E4552; border-radius: 18px; padding: 20px; border: 1px solid rgba(251,243,228,0.08); }
  .field-label { font-size: 13px; opacity: 0.7; font-weight: 700; }
  .text-input {
    width: 100%; padding: 14px 16px; font-size: 17px; border-radius: 12px;
    border: 2px solid rgba(251,243,228,0.25); background: rgba(251,243,228,0.06); color: #FBF3E4; margin-top: 6px;
  }
  .avatar {
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    color: #16333A; font-weight: 800; flex-shrink: 0; box-shadow: 0 2px 0 rgba(0,0,0,0.25);
  }
  #root { max-width: 480px; margin: 0 auto; min-height: 100vh; padding: 24px 16px 60px; display: flex; flex-direction: column; }
</style>
</head>
<body>
<div id="root"></div>

<script>
"use strict";

/* ---------- tiny helpers ---------- */
function esc(str) {
  return String(str == null ? "" : str).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function makeId() { return Math.random().toString(36).slice(2, 10); }
function el(id) { return document.getElementById(id); }

/* ---------- kvdb.io storage layer (free, no-signup, public key-value store) ----------
   Each game creates its own "bucket" on kvdb.io the moment it's hosted, and stores a
   single JSON key called "room" inside it. The bucket ID doubles as the shareable game
   code. Anyone with the link can read/write that game's data -- fine for a casual
   family game, not for anything sensitive. */
var KV_BASE = "https://kvdb.io";
/* Bucket codes are prefixed so we know which backend a given code belongs to,
   since we try multiple free no-signup services and fall back automatically. */
function kvCreateBucket() {
  function tryKvdbWithBody(bodyStr) {
    return fetch(KV_BASE + "/", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: bodyStr
    }).then(function (res) {
      if (!res.ok) return Promise.reject(new Error("kvdb status " + res.status));
      return res.text();
    }).then(function (id) {
      id = (id || "").trim();
      if (!id) return Promise.reject(new Error("kvdb returned empty id"));
      return "kv:" + id;
    });
  }
  function tryJsonblob() {
    return fetch("https://jsonblob.com/api/jsonBlob", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ placeholder: true })
    }).then(function (res) {
      if (!res.ok) return Promise.reject(new Error("jsonblob status " + res.status));
      var loc = res.headers.get("Location") || res.headers.get("location");
      if (!loc) return Promise.reject(new Error("jsonblob did not expose an id"));
      var id = loc.split("/").pop();
      if (!id) return Promise.reject(new Error("jsonblob returned empty id"));
      return "jb:" + id;
    });
  }
  return tryKvdbWithBody("email=family-game-" + Date.now() + "@example.com")
    .catch(function () { return tryKvdbWithBody(""); })
    .catch(function () { return tryJsonblob(); })
    .catch(function () {
      throw new Error("Couldn't reach any game server right now. Check your connection and try again in a minute.");
    });
}
function kvGet(bucket, key) {
  if (bucket.indexOf("jb:") === 0) {
    var blobId = bucket.slice(3);
    return fetch("https://jsonblob.com/api/jsonBlob/" + blobId, { cache: "no-store" }).then(function (res) {
      if (res.status === 404) return null;
      if (!res.ok) throw new Error("Couldn't load the game (status " + res.status + ").");
      return res.json().then(function (obj) { return obj && obj[key] !== undefined ? obj[key] : null; });
    });
  }
  var realBucket = bucket.indexOf("kv:") === 0 ? bucket.slice(3) : bucket;
  return fetch(KV_BASE + "/" + realBucket + "/" + key, { cache: "no-store" }).then(function (res) {
    if (res.status === 404) return null;
    if (!res.ok) throw new Error("Couldn't load the game (status " + res.status + ").");
    return res.text();
  }).then(function (text) {
    if (!text) return null;
    return JSON.parse(text);
  });
}
function kvSet(bucket, key, value) {
  if (bucket.indexOf("jb:") === 0) {
    var blobId = bucket.slice(3);
    var payload = {}; payload[key] = value;
    return fetch("https://jsonblob.com/api/jsonBlob/" + blobId, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    }).then(function (res) {
      if (!res.ok) throw new Error("Couldn't save to the game (status " + res.status + ").");
      return true;
    });
  }
  var realBucket = bucket.indexOf("kv:") === 0 ? bucket.slice(3) : bucket;
  return fetch(KV_BASE + "/" + realBucket + "/" + key, { method: "PUT", body: JSON.stringify(value) })
    .then(function (res) {
      if (!res.ok) throw new Error("Couldn't save to the game (status " + res.status + ").");
      return true;
    });
}
function readRoom(code) {
  return kvGet(code, "room").catch(function (e) { console.error(e); return null; });
}
function writeRoom(code, data) { return kvSet(code, "room", data); }
function updateRoom(code, updater) {
  return readRoom(code).then(function (current) {
    if (!current) return null;
    var next = updater(current);
    if (!next) return current;
    next.updatedAt = Date.now();
    return writeRoom(code, next).then(function () { return next; }).catch(function (e) {
      console.error("updateRoom write failed:", e);
      return null;
    });
  });
}

/* ---------- game constants ---------- */
var DEFAULT_PROMPTS = [
  "What's the most embarrassing thing that's happened to you at a family gathering?",
  "What food do you pretend to love at family dinners but secretly can't stand?",
  "What's the weirdest gift a relative has ever given you?",
  "If you could permanently retire one family tradition, which would it be?",
  "What's your go-to excuse for leaving a family event early?",
  "What's the last little lie you told a family member?",
  "What childhood nickname do you secretly hate?",
  "What's the most trouble you ever got into as a kid?",
  "What's something about you that would genuinely shock your grandparents?",
  "What's your most irrational fear?",
  "What's a weird food combination you actually love?",
  "What talent do you have that almost nobody in the family knows about?",
  "What's the pettiest thing you've ever argued with a sibling or cousin about?",
  "What's one household chore you'd rather die than do?",
  "If the family had a theme song, what would you title it?"
];
var AVATAR_COLORS = ["#EDA33B", "#E2583E", "#8FA998", "#7D9BC1", "#C97BB0", "#E0B84F"];
function colorForPlayer(id, players) {
  var idx = players.findIndex(function (p) { return p.id === id; });
  return AVATAR_COLORS[((idx % AVATAR_COLORS.length) + AVATAR_COLORS.length) % AVATAR_COLORS.length];
}
function avatarHtml(name, id, players, size) {
  size = size || 40;
  var initial = esc((name || "?").trim().charAt(0).toUpperCase());
  var color = colorForPlayer(id, players);
  return '<div class="avatar disp" style="width:' + size + 'px;height:' + size + 'px;background:' + color + ';font-size:' + Math.round(size * 0.42) + 'px;">' + initial + '</div>';
}
function newRoomState(code, hostName, hostId) {
  return {
    code: code, phase: "lobby", hostId: hostId,
    players: [{ id: hostId, name: hostName, score: 0 }],
    prompts: DEFAULT_PROMPTS.slice(), roundCount: 8, roundIndex: -1,
    usedTruthTellers: [], currentPrompt: null, truthTellerId: null,
    answers: {}, votes: {}, lastRoundResult: null,
    createdAt: Date.now(), updatedAt: Date.now()
  };
}
function beginRound(r) {
  var nextIndex = r.roundIndex + 1;
  if (nextIndex >= r.roundCount || nextIndex >= r.prompts.length) return r;
  var remaining = r.players.filter(function (p) { return r.usedTruthTellers.indexOf(p.id) === -1; });
  var pool = remaining.length > 0 ? remaining : r.players;
  var teller = pool[Math.floor(Math.random() * pool.length)];
  r.roundIndex = nextIndex;
  r.currentPrompt = r.prompts[nextIndex];
  r.truthTellerId = teller.id;
  r.usedTruthTellers = remaining.length > 0 ? r.usedTruthTellers.concat([teller.id]) : [teller.id];
  r.answers = {}; r.votes = {}; r.lastRoundResult = null;
  r.phase = "answering";
  return r;
}
function computeRoundResult(r) {
  var truthId = r.truthTellerId;
  var fooledCounts = {};
  var truthGuessers = [];
  Object.keys(r.votes).forEach(function (voterId) {
    var targetId = r.votes[voterId];
    if (targetId === truthId) truthGuessers.push(voterId);
    else fooledCounts[targetId] = (fooledCounts[targetId] || 0) + 1;
  });
  var pointsAwarded = {};
  truthGuessers.forEach(function (vid) { pointsAwarded[vid] = (pointsAwarded[vid] || 0) + 1000; });
  Object.keys(fooledCounts).forEach(function (bluffer) { pointsAwarded[bluffer] = (pointsAwarded[bluffer] || 0) + fooledCounts[bluffer] * 500; });
  var votersTotal = Object.keys(r.votes).length;
  var stumpBonus = votersTotal > 0 && truthGuessers.length === 0 ? 250 * votersTotal : 0;
  if (stumpBonus) pointsAwarded[truthId] = (pointsAwarded[truthId] || 0) + stumpBonus;
  r.players.forEach(function (p) { if (pointsAwarded[p.id]) p.score += pointsAwarded[p.id]; });
  return { truthId: truthId, fooledCounts: fooledCounts, truthGuessers: truthGuessers, pointsAwarded: pointsAwarded, stumpBonus: stumpBonus };
}

/* ---------- app state ---------- */
var S = {
  screen: "home", room: null, code: "", name: "", myId: null,
  error: "", busy: false, editingPrompts: false, copied: false,
  voteShuffleCache: null /* {round, order} */
};
var pollTimer = null;

function getParam(name) {
  var m = new RegExp("[?&]" + name + "=([^&]*)").exec(window.location.search);
  return m ? decodeURIComponent(m[1].replace(/\+/g, " ")) : "";
}

function startPolling(code) {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(function () {
    readRoom(code).then(function (r) {
      if (r) { S.room = r; safeRender(); }
    });
  }, 2000);
}
function stopPolling() { if (pollTimer) clearInterval(pollTimer); pollTimer = null; }

function isEditingText() {
  var a = document.activeElement;
  return a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA");
}
function safeRender() { if (!isEditingText()) render(); }

/* ---------- actions ---------- */
function goHome() { S.screen = "home"; S.error = ""; render(); }
function goCreate() { S.screen = "create"; S.error = ""; render(); }
function goJoin() { S.screen = "join"; S.error = ""; render(); }

function actionCreateGame() {
  var name = (el("name-input").value || "").trim();
  if (!name) { S.error = "Enter your name first."; render(); return; }
  S.busy = true; S.error = ""; render();
  kvCreateBucket().then(function (newCode) {
    var hostId = makeId();
    var state = newRoomState(newCode, name, hostId);
    return writeRoom(newCode, state).then(function () {
      S.busy = false; S.myId = hostId; S.room = state; S.code = newCode; S.screen = "game";
      var url = new URL(window.location.href);
      url.searchParams.set("game", newCode);
      window.history.replaceState({}, "", url);
      render();
      startPolling(newCode);
    });
  }).catch(function (e) {
    S.busy = false; S.error = "Couldn't create the game: " + (e && e.message ? e.message : "unknown error");
    render();
  });
}

function actionJoinGame() {
  var name = (el("name-input").value || "").trim();
  var codeField = el("code-input");
  var roomCode = (codeField ? codeField.value : S.code || "").trim();
  if (!name) { S.error = "Enter your name first."; render(); return; }
  if (!roomCode) { S.error = "Enter the game code or use the link the host sent you."; render(); return; }
  S.busy = true; S.error = ""; render();
  readRoom(roomCode).then(function (existing) {
    if (!existing) { S.busy = false; S.error = "No game found with that code. Double check the link or code."; render(); return; }
    if (existing.phase !== "lobby") { S.busy = false; S.error = "That game already started."; render(); return; }
    var pid = makeId();
    return updateRoom(roomCode, function (r) { r.players.push({ id: pid, name: name, score: 0 }); return r; }).then(function (updated) {
      S.busy = false;
      if (!updated) { S.error = "Couldn't join. Try again."; render(); return; }
      S.myId = pid; S.room = updated; S.code = roomCode; S.screen = "game";
      render();
      startPolling(roomCode);
    });
  });
}

function actionLeave() {
  stopPolling();
  S.screen = "home"; S.room = null; S.myId = null; S.code = ""; S.error = "";
  var url = new URL(window.location.href);
  url.searchParams.delete("game");
  window.history.replaceState({}, "", url);
  render();
}

function actionCopyLink() {
  var u = new URL(window.location.href);
  u.searchParams.set("game", S.code);
  var link = u.toString();
  if (navigator.clipboard) navigator.clipboard.writeText(link);
  S.copied = true; render();
  setTimeout(function () { S.copied = false; render(); }, 1500);
}

function actionToggleEditPrompts() { S.editingPrompts = !S.editingPrompts; render(); }

function actionAddPrompt() {
  var v = (el("prompt-draft").value || "").trim();
  if (!v) return;
  updateRoom(S.code, function (r) { r.prompts.push(v); return r; }).then(function (updated) {
    if (updated) { S.room = updated; render(); }
  });
}
function actionRemovePrompt(idx) {
  updateRoom(S.code, function (r) { r.prompts.splice(idx, 1); return r; }).then(function (updated) {
    if (updated) { S.room = updated; render(); }
  });
}
function actionResetPrompts() {
  updateRoom(S.code, function (r) { r.prompts = DEFAULT_PROMPTS.slice(); return r; }).then(function (updated) {
    if (updated) { S.room = updated; render(); }
  });
}
function actionApplyRounds() {
  var field = el("rounds-input");
  if (!field) return;
  var n = Math.max(1, Math.min(S.room.prompts.length, Number(field.value) || 1));
  updateRoom(S.code, function (r) { r.roundCount = n; return r; }).then(function (updated) {
    if (updated) { S.room = updated; render(); }
  });
}

function actionStartGame() {
  if (S.room.players.length < 3) return;
  S.busy = true; render();
  updateRoom(S.code, function (r) { return beginRound(r); }).then(function (updated) {
    S.busy = false;
    if (updated) S.room = updated;
    render();
  });
}

function actionSubmitAnswer() {
  var text = (el("answer-text").value || "").trim();
  if (!text) return;
  updateRoom(S.code, function (r) { r.answers[S.myId] = text; return r; }).then(function (updated) {
    if (updated) { S.room = updated; render(); }
  });
}
function actionForceAdvanceAnswering() {
  updateRoom(S.code, function (r) {
    r.players.forEach(function (p) { if (!r.answers[p.id]) r.answers[p.id] = "(no answer)"; });
    r.phase = "voting"; return r;
  }).then(function (updated) { if (updated) { S.room = updated; render(); } });
}
function actionStartVotingManually() {
  updateRoom(S.code, function (r) { r.phase = "voting"; return r; }).then(function (updated) {
    if (updated) { S.room = updated; render(); }
  });
}

function shuffledAnswerEntries() {
  var entries = Object.keys(S.room.answers).map(function (pid) { return [pid, S.room.answers[pid]]; });
  var key = entries.map(function (e) { return e[0]; }).slice().sort().join(",");
  if (!S.voteShuffleCache || S.voteShuffleCache.round !== S.room.roundIndex || S.voteShuffleCache.key !== key) {
    var shuffled = entries.slice();
    for (var i = shuffled.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = shuffled[i]; shuffled[i] = shuffled[j]; shuffled[j] = tmp;
    }
    S.voteShuffleCache = { round: S.room.roundIndex, key: key, order: shuffled };
  }
  return S.voteShuffleCache.order;
}

function actionVote(targetId) {
  var isTeller = S.room.truthTellerId === S.myId;
  if (isTeller || S.room.votes[S.myId] || targetId === S.myId) return;
  updateRoom(S.code, function (r) { r.votes[S.myId] = targetId; return r; }).then(function (updated) {
    if (updated) { S.room = updated; render(); }
  });
}
function actionForceReveal() {
  updateRoom(S.code, function (r) { r.phase = "reveal"; r.lastRoundResult = computeRoundResult(r); return r; }).then(function (updated) {
    if (updated) { S.room = updated; render(); }
  });
}
function actionNextRound() {
  var isLastRound = S.room.roundIndex + 1 >= S.room.roundCount || S.room.roundIndex + 1 >= S.room.prompts.length;
  updateRoom(S.code, function (r) {
    if (isLastRound) { r.phase = "gameover"; return r; }
    return beginRound(r);
  }).then(function (updated) { if (updated) { S.room = updated; render(); } });
}
function actionPlayAgain() {
  updateRoom(S.code, function (r) {
    r.phase = "lobby"; r.roundIndex = -1; r.usedTruthTellers = []; r.currentPrompt = null; r.truthTellerId = null;
    r.answers = {}; r.votes = {}; r.lastRoundResult = null;
    r.players.forEach(function (p) { p.score = 0; });
    return r;
  }).then(function (updated) { if (updated) { S.room = updated; render(); } });
}

/* ---------- views ---------- */
function viewHome() {
  return (
    '<div class="anim-in" style="display:flex;flex-direction:column;flex:1;justify-content:center;gap:28px;">' +
      '<div style="text-align:center;">' +
        '<div style="display:flex;justify-content:center;margin-bottom:10px;">' +
          '<div class="ticket" style="padding:8px 20px;transform:rotate(-3deg);"><span class="mono" style="font-weight:700;letter-spacing:2px;font-size:13px;">FAMILY EDITION</span></div>' +
        '</div>' +
        '<h1 class="disp" style="font-size:50px;font-weight:900;margin:6px 0;line-height:1.02;">Who Said It?</h1>' +
        '<p style="opacity:0.8;font-size:16px;margin:0;">One truth. A room full of bluffs. Can you spot family?</p>' +
      '</div>' +
      '<div style="display:flex;flex-direction:column;gap:12px;">' +
        '<button class="btn-primary" data-action="go-create">✨ Host a new game</button>' +
        '<button class="btn-ghost" data-action="go-join">👥 Join with a code</button>' +
      '</div>' +
      '<p style="text-align:center;font-size:13px;opacity:0.55;margin-top:4px;">Everyone plays from their own phone.</p>' +
    '</div>'
  );
}

function viewAuthForm(opts) {
  var showCode = opts.showCode;
  var codeVal = esc(S.code || "");
  return (
    '<div class="anim-in" style="display:flex;flex-direction:column;flex:1;justify-content:center;gap:18px;">' +
      '<button data-action="go-home" style="background:none;border:none;color:#FBF3E4;opacity:0.6;text-align:left;padding:0;cursor:pointer;font-size:14px;">← back</button>' +
      '<div><h2 class="disp" style="font-size:30px;font-weight:800;margin:0 0 4px;">' + esc(opts.title) + '</h2>' +
      '<p style="opacity:0.7;margin:0;font-size:15px;">' + esc(opts.subtitle) + '</p></div>' +
      (showCode ?
        '<div><label class="field-label">GAME CODE</label>' +
        '<input id="code-input" class="text-input mono" style="font-size:16px;" value="' + codeVal + '" placeholder="Paste code here" /></div>'
        : '') +
      '<div><label class="field-label">YOUR NAME</label>' +
      '<input id="name-input" class="text-input" maxlength="20" value="' + esc(S.name || "") + '" placeholder="e.g. Aunt Carol" data-enter-action="' + esc(opts.primaryAction) + '" /></div>' +
      (S.error ? '<p style="color:#F2A9A9;font-size:14px;margin:0;">' + esc(S.error) + '</p>' : '') +
      '<button class="btn-primary" data-action="' + esc(opts.primaryAction) + '" ' + (S.busy ? "disabled" : "") + '>' + (S.busy ? "..." : esc(opts.primaryLabel)) + '</button>' +
    '</div>'
  );
}

function viewTopBar(room) {
  var roundLabel = (room.phase === "lobby" || room.phase === "gameover") ? null : ("Round " + (room.roundIndex + 1) + " / " + room.roundCount);
  return (
    '<div style="display:flex;align-items:center;justify-content:space-between;">' +
      '<button data-action="leave-game" style="background:none;border:none;color:#FBF3E4;opacity:0.6;cursor:pointer;font-size:13px;">Leave</button>' +
      '<div class="mono" style="font-size:12px;opacity:0.6;letter-spacing:1px;">' + esc(roundLabel || ("Code: " + room.code)) + '</div>' +
    '</div>'
  );
}

function viewLobby(room) {
  var isHost = room.hostId === S.myId;
  var u = new URL(window.location.href);
  u.searchParams.set("game", S.code);
  var shareUrl = u.toString();

  var playersHtml = room.players.map(function (p) {
    return '<div style="display:flex;align-items:center;gap:10px;">' +
      avatarHtml(p.name, p.id, room.players, 34) +
      '<span style="font-weight:600;">' + esc(p.name) + '</span>' +
      (p.id === room.hostId ? '<span title="Host">👑</span>' : '') +
      (p.id === S.myId ? '<span style="opacity:0.5;font-size:12px;">(you)</span>' : '') +
      '</div>';
  }).join("");

  var promptsHtml = "";
  if (isHost) {
    promptsHtml = '<div class="card anim-in">' +
      '<button data-action="toggle-edit-prompts" style="background:none;border:none;color:#FBF3E4;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:space-between;width:100%;">' +
      '<span style="font-weight:800;">Prompts (' + room.prompts.length + ') — make them yours</span>' +
      '<span style="opacity:0.6;font-size:13px;">' + (S.editingPrompts ? "hide" : "edit") + '</span></button>';
    if (S.editingPrompts) {
      var promptRows = room.prompts.map(function (p, i) {
        return '<div style="display:flex;align-items:flex-start;gap:8px;background:rgba(251,243,228,0.06);border-radius:10px;padding:8px 10px;">' +
          '<span style="flex:1;font-size:14px;">' + esc(p) + '</span>' +
          '<button data-action="remove-prompt" data-idx="' + i + '" style="background:none;border:none;cursor:pointer;color:#F2A9A9;flex-shrink:0;">✕</button></div>';
      }).join("");
      promptsHtml += '<div style="margin-top:14px;display:flex;flex-direction:column;gap:10px;">' +
        '<div style="max-height:220px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;">' + promptRows + '</div>' +
        '<div style="display:flex;gap:8px;">' +
        '<input id="prompt-draft" style="flex:1;padding:10px 12px;border-radius:10px;border:2px solid rgba(251,243,228,0.2);background:rgba(251,243,228,0.06);color:#FBF3E4;font-size:14px;" placeholder="Add a family-specific prompt…" />' +
        '<button data-action="add-prompt" style="background:#EDA33B;border:none;border-radius:10px;width:42px;cursor:pointer;color:#16333A;font-weight:800;">+</button></div>' +
        '<div style="display:flex;align-items:center;gap:10px;margin-top:4px;">' +
        '<label style="font-size:13px;opacity:0.7;">Rounds to play:</label>' +
        '<input id="rounds-input" type="number" min="1" max="' + room.prompts.length + '" value="' + room.roundCount + '" data-action-change="apply-rounds" style="width:56px;padding:6px 8px;border-radius:8px;border:2px solid rgba(251,243,228,0.2);background:rgba(251,243,228,0.06);color:#FBF3E4;" />' +
        '<button data-action="reset-prompts" style="margin-left:auto;background:none;border:none;color:#FBF3E4;opacity:0.6;font-size:12px;cursor:pointer;">↺ reset defaults</button>' +
        '</div></div>';
    }
    promptsHtml += '</div>';
  }

  var startArea = isHost
    ? '<div style="display:flex;flex-direction:column;gap:8px;">' +
      '<button class="btn-primary" data-action="start-game" ' + (room.players.length < 3 || S.busy ? "disabled" : "") + '>' +
      (room.players.length < 3 ? "Need at least 3 players" : (S.busy ? "Starting..." : "✨ Start game")) + '</button>' +
      '<p style="text-align:center;font-size:12px;opacity:0.5;margin:0;">Players can join right up until you start.</p></div>'
    : '<p style="text-align:center;opacity:0.7;">Waiting for the host to start the game…</p>';

  return (
    '<div style="display:flex;flex-direction:column;gap:16px;">' +
      '<div class="ticket anim-pop" style="padding:20px 16px;text-align:center;">' +
        '<div class="mono" style="font-size:12px;font-weight:700;opacity:0.6;letter-spacing:2px;">SHARE THIS LINK</div>' +
        '<div class="mono" style="font-size:13px;word-break:break-all;margin:8px 0;">' + esc(shareUrl) + '</div>' +
        '<button data-action="copy-link" style="border:none;background:#16333A;color:#FBF3E4;border-radius:10px;padding:8px 16px;font-size:13px;cursor:pointer;font-weight:700;">' + (S.copied ? "Copied!" : "Copy link") + '</button>' +
      '</div>' +
      '<div class="card anim-in"><div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;"><span style="font-weight:800;">👥 ' + room.players.length + ' joined</span></div>' +
      '<div style="display:flex;flex-direction:column;gap:10px;">' + playersHtml + '</div></div>' +
      promptsHtml +
      startArea +
    '</div>'
  );
}

function viewAnswering(room) {
  var isTeller = room.truthTellerId === S.myId;
  var submitted = !!room.answers[S.myId];
  var submittedCount = Object.keys(room.answers).length;
  var totalNeeded = room.players.length;
  var tellerName = "";
  for (var i = 0; i < room.players.length; i++) if (room.players[i].id === room.truthTellerId) tellerName = room.players[i].name;
  var isHost = room.hostId === S.myId;

  var checklist = room.players.map(function (p) {
    var has = !!room.answers[p.id];
    return '<div style="display:flex;align-items:center;gap:6px;background:rgba(251,243,228,0.06);border-radius:20px;padding:4px 10px 4px 4px;opacity:' + (has ? "1" : "0.45") + ';">' +
      avatarHtml(p.name, p.id, room.players, 22) +
      '<span style="font-size:12px;font-weight:700;">' + esc(p.name) + '</span>' +
      (has ? '<span>✓</span>' : '') + '</div>';
  }).join("");

  var body = submitted
    ? '<div class="card anim-in" style="text-align:center;"><div>✓</div><p style="margin:8px 0 0;">Answer locked in. Waiting on ' + (totalNeeded - submittedCount) + ' more…</p></div>'
    : '<div class="card anim-in">' +
      '<p style="margin:0 0 10px;font-size:14px;opacity:0.8;">' + (isTeller ? "Answer honestly — everyone else is about to try and copy your vibe." : "Write a convincing fake answer to blend in with the truth.") + '</p>' +
      '<textarea id="answer-text" rows="3" placeholder="' + (isTeller ? "Your true answer…" : "Your bluff…") + '" style="width:100%;padding:12px;border-radius:12px;border:2px solid rgba(251,243,228,0.2);background:rgba(251,243,228,0.06);color:#FBF3E4;font-size:15px;resize:none;"></textarea>' +
      '<div style="margin-top:10px;"><button class="btn-primary" data-action="submit-answer">Submit</button></div>' +
      '</div>';

  var hostControls = "";
  if (isHost) {
    if (submittedCount < totalNeeded) hostControls = '<button class="btn-ghost" data-action="force-advance-answering">Skip stragglers &amp; move to voting</button>';
    else hostControls = '<button class="btn-primary" data-action="start-voting-manually">Everyone\'s in — start voting</button>';
  }

  return (
    '<div style="display:flex;flex-direction:column;gap:16px;">' +
      '<div class="card anim-in" style="background:' + (isTeller ? "#3B5E43" : "#1E4552") + ';">' +
        '<div class="mono" style="font-size:12px;opacity:0.7;font-weight:700;letter-spacing:1px;margin-bottom:6px;">' + (isTeller ? "YOU'RE THE ANSWERER" : (esc(tellerName) + " IS ANSWERING FOR REAL")) + '</div>' +
        '<div class="disp" style="font-size:22px;font-weight:700;line-height:1.3;">' + esc(room.currentPrompt) + '</div>' +
      '</div>' +
      body +
      '<div style="display:flex;flex-wrap:wrap;gap:8px;">' + checklist + '</div>' +
      hostControls +
    '</div>'
  );
}

function viewVoting(room) {
  var isTeller = room.truthTellerId === S.myId;
  var myVote = room.votes[S.myId];
  var entries = shuffledAnswerEntries();
  var voteCount = Object.keys(room.votes).length;
  var votersNeeded = room.players.length - 1;
  var isHost = room.hostId === S.myId;

  var answersHtml;
  if (isTeller) {
    answersHtml = '<div class="card anim-in" style="text-align:center;"><p style="margin:0;opacity:0.85;">You already answered honestly — sit back and watch everyone try to catch you.</p></div>';
  } else {
    answersHtml = '<div style="display:flex;flex-direction:column;gap:10px;">' + entries.map(function (pair) {
      var pid = pair[0], text = pair[1];
      var isOwn = pid === S.myId;
      var voted = myVote === pid;
      var disabled = isOwn || !!myVote;
      return '<button data-action="vote" data-pid="' + esc(pid) + '" ' + (disabled ? "disabled" : "") + ' style="text-align:left;padding:16px;border-radius:14px;border:' + (voted ? "2px solid #EDA33B" : "2px solid rgba(251,243,228,0.15)") + ';background:' + (isOwn ? "rgba(251,243,228,0.03)" : "#1E4552") + ';color:#FBF3E4;cursor:' + (disabled ? "default" : "pointer") + ';font-size:15px;opacity:' + (isOwn ? "0.5" : "1") + ';position:relative;width:100%;">' +
        esc(text) +
        (isOwn ? '<div style="font-size:11px;opacity:0.7;margin-top:6px;">— your answer</div>' : '') +
        (voted ? '<div style="position:absolute;top:10px;right:10px;">✓</div>' : '') +
        '</button>';
    }).join("") + '</div>';
  }

  var hostBtn = isHost ? '<button class="btn-primary" data-action="force-reveal">' + (voteCount >= votersNeeded ? "Reveal the truth" : "Reveal now (skip stragglers)") + '</button>' : "";

  return (
    '<div style="display:flex;flex-direction:column;gap:16px;">' +
      '<div class="card anim-in"><div class="mono" style="font-size:12px;opacity:0.7;font-weight:700;letter-spacing:1px;margin-bottom:6px;">WHO\'S TELLING THE TRUTH?</div>' +
      '<div class="disp" style="font-size:20px;font-weight:700;line-height:1.3;">' + esc(room.currentPrompt) + '</div></div>' +
      answersHtml +
      (myVote && !isTeller ? '<p style="text-align:center;opacity:0.7;font-size:14px;">Vote locked. Waiting on the rest of the family…</p>' : '') +
      '<div style="display:flex;justify-content:center;font-size:13px;opacity:0.6;">' + voteCount + '/' + votersNeeded + ' voted</div>' +
      hostBtn +
    '</div>'
  );
}

function viewReveal(room) {
  var result = room.lastRoundResult || computeRoundResult(JSON.parse(JSON.stringify(room)));
  var truthPlayer = null;
  for (var i = 0; i < room.players.length; i++) if (room.players[i].id === result.truthId) truthPlayer = room.players[i];
  var entries = Object.keys(room.answers).map(function (pid) { return [pid, room.answers[pid]]; });
  var isLastRound = room.roundIndex + 1 >= room.roundCount || room.roundIndex + 1 >= room.prompts.length;
  var isHost = room.hostId === S.myId;
  var sortedPlayers = room.players.slice().sort(function (a, b) { return b.score - a.score; });

  var answerRows = entries.map(function (pair) {
    var pid = pair[0], text = pair[1];
    var player = null;
    for (var j = 0; j < room.players.length; j++) if (room.players[j].id === pid) player = room.players[j];
    var isTruth = pid === result.truthId;
    var votesReceived = Object.keys(room.votes).filter(function (v) { return room.votes[v] === pid; }).length;
    var pts = result.pointsAwarded[pid] || 0;
    return '<div style="padding:12px;border-radius:12px;background:' + (isTruth ? "rgba(143,169,152,0.18)" : "rgba(251,243,228,0.05)") + ';border:' + (isTruth ? "1px solid #8FA998" : "1px solid transparent") + ';">' +
      '<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">' +
      avatarHtml(player ? player.name : "", pid, room.players, 22) +
      '<span style="font-weight:700;font-size:13px;">' + esc(player ? player.name : "") + '</span>' +
      (isTruth ? '<span style="font-size:11px;background:#8FA998;color:#16333A;border-radius:8px;padding:1px 6px;font-weight:800;">TRUTH</span>' : '') +
      (!isTruth && votesReceived > 0 ? '<span style="font-size:11px;opacity:0.7;">fooled ' + votesReceived + '</span>' : '') +
      (pts > 0 ? '<span style="margin-left:auto;font-size:12px;font-weight:800;color:#EDA33B;">+' + pts + '</span>' : '') +
      '</div><div style="font-size:14px;opacity:0.9;">' + esc(text) + '</div></div>';
  }).join("");

  var scoreRows = sortedPlayers.map(function (p, i) {
    return '<div style="display:flex;align-items:center;gap:10px;">' +
      '<span class="mono" style="width:18px;opacity:0.5;font-size:13px;">' + (i + 1) + '</span>' +
      avatarHtml(p.name, p.id, room.players, 26) +
      '<span style="font-weight:600;flex:1;">' + esc(p.name) + (p.id === S.myId ? " (you)" : "") + '</span>' +
      '<span class="mono" style="font-weight:800;">' + p.score + '</span></div>';
  }).join("");

  return (
    '<div style="display:flex;flex-direction:column;gap:16px;">' +
      '<div class="card anim-pop" style="background:#3B5E43;">' +
      '<div class="mono" style="font-size:12px;opacity:0.75;font-weight:700;letter-spacing:1px;margin-bottom:6px;">THE TRUTH</div>' +
      '<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">' + avatarHtml(truthPlayer ? truthPlayer.name : "", result.truthId, room.players, 30) +
      '<span style="font-weight:800;">' + esc(truthPlayer ? truthPlayer.name : "") + '</span></div>' +
      '<div style="font-size:16px;">' + esc(room.answers[result.truthId]) + '</div>' +
      (result.stumpBonus > 0 ? '<div style="margin-top:8px;font-size:13px;opacity:0.85;">😲 Stumped everyone — bonus points!</div>' : '') +
      '</div>' +
      '<div class="card anim-in"><div style="font-weight:800;margin-bottom:10px;">Everyone\'s answers</div><div style="display:flex;flex-direction:column;gap:10px;">' + answerRows + '</div></div>' +
      '<div class="card anim-in"><div style="font-weight:800;margin-bottom:10px;">Scoreboard</div><div style="display:flex;flex-direction:column;gap:8px;">' + scoreRows + '</div></div>' +
      (isHost ? '<button class="btn-primary" data-action="next-round">' + (isLastRound ? "See final results" : "Next round") + '</button>'
        : '<p style="text-align:center;opacity:0.6;font-size:13px;">Waiting for the host to continue…</p>') +
    '</div>'
  );
}

function viewGameOver(room) {
  var sorted = room.players.slice().sort(function (a, b) { return b.score - a.score; });
  var winner = sorted[0];
  var isHost = room.hostId === S.myId;
  var rows = sorted.map(function (p, i) {
    return '<div style="display:flex;align-items:center;gap:10px;">' +
      '<span class="mono" style="width:18px;opacity:0.5;">' + (i + 1) + '</span>' +
      avatarHtml(p.name, p.id, room.players, 30) +
      '<span style="font-weight:700;flex:1;">' + esc(p.name) + '</span>' +
      '<span class="mono" style="font-weight:800;">' + p.score + '</span></div>';
  }).join("");
  return (
    '<div style="display:flex;flex-direction:column;gap:18px;">' +
      '<div class="anim-pop" style="text-align:center;margin-top:10px;"><div style="font-size:44px;">🏆</div>' +
      '<h2 class="disp" style="font-size:30px;font-weight:900;margin:8px 0 2px;">' + esc(winner ? winner.name : "") + ' wins!</h2>' +
      '<p style="opacity:0.7;margin:0;">' + (winner ? winner.score : 0) + ' points</p></div>' +
      '<div class="card anim-in"><div style="display:flex;flex-direction:column;gap:10px;">' + rows + '</div></div>' +
      (isHost ? '<button class="btn-primary" data-action="play-again">🔀 Play again</button>' : '<p style="text-align:center;opacity:0.6;font-size:13px;">Waiting for the host to start a new round…</p>') +
      '<button class="btn-ghost" data-action="leave-game">Leave game</button>' +
    '</div>'
  );
}

/* ---------- render ---------- */
function render() {
  var root = el("root");
  var html = "";

  if (S.screen === "home") {
    html = viewHome();
  } else if (S.screen === "create") {
    html = viewAuthForm({ title: "Start a family game", subtitle: "Everyone joins from their own phone with a link.", primaryLabel: "Create game", primaryAction: "create-game", showCode: false });
  } else if (S.screen === "join") {
    html = viewAuthForm({ title: "Join the game", subtitle: (S.codeFromLink ? "You're joining via the link the host sent." : "Ask the host for their game link or code."), primaryLabel: "Join game", primaryAction: "join-game", showCode: !S.codeFromLink });
  } else if (S.screen === "game" && S.room) {
    var room = S.room;
    var me = room.players.filter(function (p) { return p.id === S.myId; })[0];
    if (!me) {
      html = '<div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;"><p>You\'ve been removed from this game or it ended.</p><button class="btn-primary" data-action="leave-game">Back home</button></div>';
    } else {
      var inner = "";
      if (room.phase === "lobby") inner = viewLobby(room);
      else if (room.phase === "answering") inner = viewAnswering(room);
      else if (room.phase === "voting") inner = viewVoting(room);
      else if (room.phase === "reveal") inner = viewReveal(room);
      else if (room.phase === "gameover") inner = viewGameOver(room);
      html = '<div style="display:flex;flex-direction:column;flex:1;gap:16px;">' + viewTopBar(room) + inner + '</div>';
    }
  }

  root.innerHTML = html;
}

/* ---------- event delegation ---------- */
document.addEventListener("click", function (e) {
  var target = e.target.closest("[data-action]");
  if (!target) return;
  var action = target.getAttribute("data-action");
  switch (action) {
    case "go-home": goHome(); break;
    case "go-create": goCreate(); break;
    case "go-join": goJoin(); break;
    case "create-game": actionCreateGame(); break;
    case "join-game": actionJoinGame(); break;
    case "leave-game": actionLeave(); break;
    case "copy-link": actionCopyLink(); break;
    case "toggle-edit-prompts": actionToggleEditPrompts(); break;
    case "add-prompt": actionAddPrompt(); break;
    case "remove-prompt": actionRemovePrompt(Number(target.getAttribute("data-idx"))); break;
    case "reset-prompts": actionResetPrompts(); break;
    case "start-game": actionStartGame(); break;
    case "submit-answer": actionSubmitAnswer(); break;
    case "force-advance-answering": actionForceAdvanceAnswering(); break;
    case "start-voting-manually": actionStartVotingManually(); break;
    case "vote": actionVote(target.getAttribute("data-pid")); break;
    case "force-reveal": actionForceReveal(); break;
    case "next-round": actionNextRound(); break;
    case "play-again": actionPlayAgain(); break;
  }
});
document.addEventListener("change", function (e) {
  var target = e.target.closest("[data-action-change]");
  if (!target) return;
  var action = target.getAttribute("data-action-change");
  if (action === "apply-rounds") actionApplyRounds();
});
document.addEventListener("keydown", function (e) {
  if (e.key !== "Enter") return;
  var target = e.target.closest("[data-enter-action]");
  if (!target) return;
  var action = target.getAttribute("data-enter-action");
  if (action === "create-game") actionCreateGame();
  else if (action === "join-game") actionJoinGame();
});

/* ---------- boot ---------- */
(function boot() {
  var codeFromLink = getParam("game");
  if (codeFromLink) { S.code = codeFromLink; S.codeFromLink = true; S.screen = "join"; }
  render();
})();
</script>
</body>
</html>
